name: rabay_cell
description: Rabay Cell - aplikasi kasir Android offline dengan SQLite.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.10.0
  sqflite: ^2.4.1
  path: ^1.9.1
  path_provider: ^2.1.5
  crypto: ^3.0.6
  intl: ^0.20.2
  file_picker: ^8.1.7
  share_plus: ^10.1.4
  cross_file: ^0.3.4+2
  
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/rabay_logo.png
    - assets/rabay_icon.png
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/rabay_icon.png"
  adaptive_icon_background: "#19B5AE"
  adaptive_icon_foreground: "assets/rabay_icon.png"
  min_sdk_android: 21
  
